name: weatherapp
description: A new Flutter project.
publish_to: 'none'

version: 1.0.0+2

environment:
  sdk: '>=3.0.0 <4.0.0'

dependencies:
  flutter:
    sdk: flutter
  cupertino_icons: 1.0.8
  dio: ^5.9.0
  flutter_native_splash: ^2.4.7
  geolocator: ^14.0.2
  shimmer: ^3.0.0
  connectivity_plus: ^7.0.0
  shared_preferences: ^2.5.4

dev_dependencies:
  flutter_test:
    sdk: flutter
  flutter_lints: ^6.0.0

flutter_native_splash:
  color: '#ffffff'
  image: assets/images/brightness.png
  android: true
  ios: true
  android_gravity: center
  ios_content_mode: center
  fullscreen: true
  color_dark: '#ffffff'
  background_image_dark: assets/images/brightness.png

flutter:
  uses-material-design: true
  assets:
    - assets/images/
    - assets/images/day/
    - assets/images/night/

  fonts:
    - family: Poppins
      fonts:
        - asset: assets/fonts/Poppins-Light.ttf
